
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "ml-backend"
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]
